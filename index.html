<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lunch Count</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

header {
    background: #123c69;
    color: white;
    padding: 25px 40px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 6px 0 0;
    opacity: 0.85;
}

.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.home {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.building-card {
    background: white;
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: 0.2s;
}

.building-card:hover {
    transform: translateY(-4px);
}

.building-card h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.building-card button {
    margin-top: 20px;
    padding: 14px 30px;
    border: none;
    border-radius: 8px;
    background: #123c69;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.page {
    display: none;
}

.back {
    background: none;
    border: none;
    color: #123c69;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 20px;
}

.layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 30px;
}

.form-card,
.results-card {
    background: white;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.form-card h2,
.results-card h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

.submit-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #198754;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #157347;
}

.total {
    font-size: 38px;
    font-weight: bold;
    margin: 15px 0 25px;
    color: #123c69;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

th {
    background: #f8fafc;
}

.message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 7px;
    display: none;
}

.success {
    background: #d1e7dd;
    color: #0f5132;
}

.error {
    background: #f8d7da;
    color: #842029;
}

.loading {
    text-align: center;
    padding: 20px;
}

@media(max-width: 800px) {

    .home {
        grid-template-columns: 1fr;
    }

    .layout {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<header>

    <h1>Lunch Count</h1>
    <p>Daily Student Lunch Count</p>

</header>


<div class="container">

    <!-- HOME -->

    <div id="homePage">

        <div class="home">

            <div class="building-card" onclick="openBuilding('Building 1')">

                <h2>Building 1</h2>

                <p>Enter lunch count for Building 1</p>

                <button>Open Building 1</button>

            </div>


            <div class="building-card" onclick="openBuilding('Building 2')">

                <h2>Building 2</h2>

                <p>Enter lunch count for Building 2</p>

                <button>Open Building 2</button>

            </div>

        </div>

    </div>


    <!-- BUILDING PAGE -->

    <div id="buildingPage" class="page">

        <button class="back" onclick="goHome()">
            ← Back to Buildings
        </button>


        <div class="layout">


            <!-- LEFT SIDE -->

            <div class="form-card">

                <h2 id="buildingTitle">
                    Building 1
                </h2>


                <label>
                    Teacher
                </label>

                <select id="teacherSelect">

                    <option value="">
                        Select your name
                    </option>

                </select>


                <label>
                    How many students need lunch?
                </label>

                <input
                    type="number"
                    id="lunchCount"
                    min="0"
                    placeholder="Example: 20"
                >


                <button
                    class="submit-btn"
                    onclick="submitLunch()"
                >
                    SUBMIT
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="results-card">

                <h2 id="resultsTitle">
                    Building 1 Lunch Count
                </h2>


                <div class="total">

                    Total:
                    <span id="totalCount">
                        0
                    </span>

                </div>


                <div id="results">

                    <div class="loading">
                        Loading...
                    </div>

                </div>

            </div>


        </div>

    </div>

</div>


<script>


/* =========================================
   GOOGLE APPS SCRIPT URL
========================================= */

const API_URL =
"https://script.google.com/a/macros/seminolescience.net/s/AKfycbwI5WYmIqwG59abeEpW2ZKZTENXitBqwVtDQGnYqOryIK5dkr_E6RMHx1zX3Gajq-xA6Q/exec";


let currentBuilding = "";

let allTeachers = [];

let allLunchData = [];


/* =========================================
   OPEN BUILDING
========================================= */

function openBuilding(building) {

    currentBuilding = building;

    document.getElementById("homePage").style.display = "none";

    document.getElementById("buildingPage").style.display = "block";

    document.getElementById("buildingTitle").innerText =
        building;

    document.getElementById("resultsTitle").innerText =
        building + " Lunch Count";

    loadTeachers();

    loadLunchData();

}


/* =========================================
   GO HOME
========================================= */

function goHome() {

    document.getElementById("homePage").style.display = "block";

    document.getElementById("buildingPage").style.display = "none";

    currentBuilding = "";

}


/* =========================================
   LOAD TEACHERS
========================================= */

async function loadTeachers() {

    const select =
        document.getElementById("teacherSelect");

    select.innerHTML =
        '<option value="">Loading teachers...</option>';

    try {

        const response =
            await fetch(API_URL + "?action=teachers");

        const result =
            await response.json();

        allTeachers = result.teachers || [];

        select.innerHTML =
            '<option value="">Select your name</option>';

        allTeachers

            .filter(function(teacher) {

                return teacher.building === currentBuilding;

            })

            .sort(function(a,b) {

                return a.name.localeCompare(b.name);

            })

            .forEach(function(teacher) {

                const option =
                    document.createElement("option");

                option.value = teacher.name;

                option.textContent = teacher.name;

                select.appendChild(option);

            });


    } catch(error) {

        select.innerHTML =
            '<option value="">Unable to load teachers</option>';

        showMessage(
            "Could not load teacher list.",
            false
        );

    }

}


/* =========================================
   LOAD LUNCH DATA
========================================= */

async function loadLunchData() {

    try {

        const response =
            await fetch(API_URL + "?action=lunch");

        const result =
            await response.json();

        allLunchData = result.data || [];

        displayLunchData();

    } catch(error) {

        document.getElementById("results").innerHTML =
            "<p>Unable to load lunch data.</p>";

    }

}


/* =========================================
   DISPLAY LUNCH DATA
========================================= */

function displayLunchData() {

    const today =
        new Date().toISOString().split("T")[0];


    const buildingData =
        allLunchData.filter(function(item) {

            return (
                item.building === currentBuilding
            );

        });


    const teacherData = {};


    buildingData.forEach(function(item) {

        const itemDate =
            formatDate(item.date);

        if (itemDate === today) {

            teacherData[item.teacher] =
                Number(item.lunch) || 0;

        }

    });


    let total = 0;

    Object.values(teacherData)
        .forEach(function(value) {

            total += value;

        });


    document.getElementById("totalCount").innerText =
        total;


    const teachers =
        Object.keys(teacherData).sort();


    if (teachers.length === 0) {

        document.getElementById("results").innerHTML =
            "<p>No lunch counts submitted yet today.</p>";

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>Teacher</th>

                    <th>Lunch</th>

                </tr>

            </thead>

            <tbody>

    `;


    teachers.forEach(function(teacher) {

        html += `

            <tr>

                <td>${escapeHtml(teacher)}</td>

                <td>${teacherData[teacher]}</td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    document.getElementById("results").innerHTML =
        html;

}


/* =========================================
   SUBMIT
========================================= */

async function submitLunch() {

    const teacher =
        document.getElementById("teacherSelect").value;

    const lunch =
        document.getElementById("lunchCount").value;


    if (!teacher) {

        showMessage(
            "Please select your name.",
            false
        );

        return;

    }


    if (
        lunch === "" ||
        Number(lunch) < 0
    ) {

        showMessage(
            "Please enter the number of students.",
            false
        );

        return;

    }


    const button =
        document.querySelector(".submit-btn");

    button.disabled = true;

    button.innerText = "SUBMITTING...";


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                body: JSON.stringify({

                    building: currentBuilding,

                    teacher: teacher,

                    lunch: Number(lunch)

                })

            });


        const result =
            await response.json();


        if (result.success) {

            showMessage(
                "Lunch count submitted successfully!",
                true
            );

            document.getElementById("lunchCount").value = "";

            await loadLunchData();

        } else {

            showMessage(
                result.message || "Something went wrong.",
                false
            );

        }


    } catch(error) {

        showMessage(
            "Could not submit lunch count.",
            false
        );

    }


    button.disabled = false;

    button.innerText = "SUBMIT";

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, success) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.className =
        "message " +
        (success ? "success" : "error");

    message.style.display = "block";


    setTimeout(function() {

        message.style.display = "none";

    }, 4000);

}


/* =========================================
   DATE
========================================= */

function formatDate(value) {

    const date =
        new Date(value);

    if (isNaN(date)) {
        return "";
    }

    return date.toISOString().split("T")[0];

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


</script>

</body>
</html>
