<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSCS Lunch Count</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #123b6d;
            margin-bottom: 5px;
        }

        .school {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .lunch-box {
            margin-top: 25px;
            padding: 20px;
            background: #f7f9fc;
            border-radius: 15px;
        }

        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .counter button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            background: #123b6d;
            color: white;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .menu {
            display: block;
            text-align: center;
            margin: 25px 0;
            color: #123b6d;
            font-weight: bold;
            text-decoration: none;
        }

        .submit {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #123b6d;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover {
            background: #0d2c52;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍽️ LUNCH COUNT</h1>

    <div class="school">
        Seminole Science Charter School
    </div>

    <label for="teacher">Teacher Name</label>

    <select id="teacher">
        <option value="">Select your name</option>
        <option>Teacher 1</option>
        <option>Teacher 2</option>
        <option>Teacher 3</option>
        <option>Teacher 4</option>
        <option>Teacher 5</option>
    </select>

    <a class="menu" href="#" target="_blank">
        📋 View Today's Lunch Menu
    </a>

    <div class="lunch-box">

        <label>How many students are eating school lunch?</label>

        <div class="counter">

            <button onclick="changeCount(-1)">−</button>

            <div class="number" id="count">0</div>

            <button onclick="changeCount(1)">+</button>

        </div>

    </div>

    <button class="submit" onclick="submitLunch()">
        SUBMIT LUNCH COUNT
    </button>

    <div id="message"></div>

</div>

<script>

let count = 0;

function changeCount(amount) {

    count += amount;

    if (count < 0) {
        count = 0;
    }

    document.getElementById("count").innerText = count;
}

function submitLunch() {

    const teacher = document.getElementById("teacher").value;

    if (teacher === "") {
        alert("Please select your name.");
        return;
    }

    document.getElementById("message").innerText =
        "Lunch count submitted: " + count;

}

</script>

</body>
</html>
