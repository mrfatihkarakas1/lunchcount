<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSCS Lunch Count</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4fb, #dce8f5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 60px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            text-align: center;
        }

        .school {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 48px;
            color: #123b6d;
            margin: 10px 0 45px;
        }

        .subtitle {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }

        .building-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .building-button {
            width: 280px;
            padding: 30px 20px;
            border: none;
            border-radius: 18px;
            background: #123b6d;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .building-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .building-icon {
            font-size: 45px;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 36px;
            }

            .container {
                padding: 40px 20px;
            }

            .building-button {
                width: 100%;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="school">
            SEMINOLE SCIENCE CHARTER SCHOOL
        </div>

        <h1>🍽️ LUNCH COUNT</h1>

        <div class="subtitle">
            Select Your Building
        </div>

        <div class="building-container">

            <button
                class="building-button"
                onclick="location.href='building1.html'">

                <span class="building-icon">🏫</span>

                BUILDING 1

            </button>

            <button
                class="building-button"
                onclick="location.href='building2.html'">

                <span class="building-icon">🏫</span>

                BUILDING 2

            </button>

        </div>

    </div>

</body>
</html>
