<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Building 2 - Lunch Count</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fa;
    min-height: 100vh;
}

header {
    background: #123b6d;
    color: white;
    padding: 22px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.menu-btn {
    background: white;
    color: #123b6d;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: 35px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    color: #123b6d;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #123b6d;
}

.submit-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: #123b6d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #0d2d52;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.teacher-list {
    margin-top: 20px;
}

.teacher-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 5px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 17px;
}

.teacher-name {
    font-weight: 600;
}

.count {
    font-weight: bold;
}

.total-box {
    margin-top: 25px;
    padding: 20px;
    background: #123b6d;
    color: white;
    border-radius: 10px;
    text-align: center;
}

.total-label {
    font-size: 16px;
}

.total-number {
    font-size: 38px;
    font-weight: bold;
    margin-top: 5px;
}

.back-btn {
    display: inline-block;
    margin-top: 20px;
    color: #123b6d;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 750px) {
    .container {
        grid-template-columns: 1fr;
    }

    header {
        padding: 18px 20px;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SSCS Lunch Count — Building 2</h1>

    <a
        class="menu-btn"
        href="https://sla-oss.nutrislice.com/menus-eula"
        target="_blank">
        🍽️ Lunch Menu
    </a>
</header>

<div class="container">

    <div class="card">

        <h2>Enter Lunch Count</h2>

        <form id="lunchForm">

            <label for="teacher">
                Teacher Name
            </label>

            <input
                type="text"
                id="teacher"
                placeholder="Enter your name"
                autocomplete="off"
                required
            >

            <label for="lunchCount">
                Lunch Count
            </label>

            <input
                type="text"
                id="lunchCount"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="Enter number"
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="submit-btn">
                Submit Lunch Count
            </button>

        </form>

        <div id="message" class="message"></div>

        <a
            class="back-btn"
            href="index.html">
            ← Back to Building Selection
        </a>

    </div>

    <div class="card">

        <h2>Today's Lunch Count</h2>

        <div id="teacherList" class="teacher-list">
            <div style="color:#777;">
                Loading...
            </div>
        </div>

        <div class="total-box">

            <div class="total-label">
                TOTAL LUNCHES
            </div>

            <div
                id="total"
                class="total-number">
                0
            </div>

        </div>

    </div>

</div>

<script>

const API_URL =
"https://script.google.com/a/macros/seminolescience.net/s/AKfycbxnLMwGSHSisca1RG5FbbBMBAMwZOQhNcDOVqPE71p_ddWkcIKLO-4boJPxFycDVFsyIA/exec";


/* BUILDING 2 */
const BUILDING = "Building 2";


async function loadData() {

    try {

        const response = await fetch(
            API_URL +
            "?building=" +
            encodeURIComponent(BUILDING)
        );

        const data = await response.json();

        displayData(data);

    } catch (error) {

        console.error(error);

        document.getElementById("teacherList").innerHTML =
            "<div style='color:#777;'>No entries yet.</div>";

    }

}


function displayData(data) {

    const list =
        document.getElementById("teacherList");

    const totalElement =
        document.getElementById("total");

    list.innerHTML = "";

    if (!data.entries || data.entries.length === 0) {

        list.innerHTML =
            "<div style='color:#777;'>No lunch counts submitted yet.</div>";

        totalElement.textContent = "0";

        return;
    }

    let total = 0;

    data.entries.forEach(function(entry) {

        total += Number(entry.lunchCount);

        const row =
            document.createElement("div");

        row.className = "teacher-row";

        const teacher =
            document.createElement("span");

        teacher.className = "teacher-name";

        teacher.textContent =
            entry.teacher;

        const count =
            document.createElement("span");

        count.className = "count";

        count.textContent =
            entry.lunchCount;

        row.appendChild(teacher);

        row.appendChild(count);

        list.appendChild(row);

    });

    totalElement.textContent = total;

}


document
.getElementById("lunchForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const teacher =
        document
        .getElementById("teacher")
        .value
        .trim();

    const lunchCount =
        document
        .getElementById("lunchCount")
        .value
        .trim();

    if (!teacher) {

        alert("Please enter your name.");

        return;
    }

    if (
        lunchCount === "" ||
        !/^[0-9]+$/.test(lunchCount)
    ) {

        alert("Please enter a valid number.");

        return;
    }

    const formData = {

        building: BUILDING,

        teacher: teacher,

        lunchCount: Number(lunchCount)

    };

    const message =
        document.getElementById("message");

    message.textContent =
        "Saving...";

    fetch(API_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify(formData)

    })
    .then(function() {

        message.textContent =
            "✓ Lunch count saved!";

        document
        .getElementById("lunchCount")
        .value = "";

        loadData();

        setTimeout(function() {

            message.textContent = "";

        }, 3000);

    })
    .catch(function(error) {

        console.error(error);

        message.textContent =
            "There was an error saving.";

    });

});


document
.getElementById("lunchCount")
.addEventListener("input", function() {

    this.value =
        this.value.replace(/[^0-9]/g, "");

});


loadData();

setInterval(loadData, 10000);

</script>

</body>
</html>
