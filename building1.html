<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Building 1 - Lunch Count</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fa;
    min-height: 100vh;
}

header {
    background: #123b6d;
    color: white;
    padding: 22px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.menu-btn {
    background: white;
    color: #123b6d;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: 35px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    color: #123b6d;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #123b6d;
}

.submit-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: #123b6d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #0d2d52;
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.teacher-list {
    margin-top: 20px;
}

.teacher-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 5px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 17px;
}

.teacher-name {
    font-weight: 600;
}

.count {
    font-weight: bold;
}

.total-box {
    margin-top: 25px;
    padding: 20px;
    background: #123b6d;
    color: white;
    border-radius: 10px;
    text-align: center;
}

.total-label {
    font-size: 16px;
}

.total-number {
    font-size: 38px;
    font-weight: bold;
    margin-top: 5px;
}

.back-btn {
    display: inline-block;
    margin-top: 20px;
    color: #123b6d;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 750px) {

    .container {
        grid-template-columns: 1fr;
    }

    header {
        padding: 18px 20px;
    }

    header h1 {
        font-size: 22px;
    }

}

</style>

</head>


<body>


<header>

<h1>
SSCS Lunch Count — Building 1
</h1>

<a
class="menu-btn"
href="https://sla-oss.nutrislice.com/menus-eula"
target="_blank">

🍽️ Lunch Menu

</a>

</header>



<div class="container">


<!-- LEFT -->

<div class="card">

<h2>
Enter Lunch Count
</h2>


<form id="lunchForm">


<label for="teacher">
Teacher Name
</label>

<input
type="text"
id="teacher"
placeholder="Enter your name"
autocomplete="off"
required
>


<label for="lunchCount">
Lunch Count
</label>

<input
type="text"
id="lunchCount"
inputmode="numeric"
pattern="[0-9]*"
placeholder="Enter number"
autocomplete="off"
required
>


<button
type="submit"
class="submit-btn"
id="submitBtn">

Submit Lunch Count

</button>


</form>


<div
id="message"
class="message">
</div>


<a
class="back-btn"
href="index.html">

← Back to Building Selection

</a>

</div>



<!-- RIGHT -->

<div class="card">

<h2>
Today's Lunch Count
</h2>


<div
id="teacherList"
class="teacher-list">

Loading...

</div>


<div class="total-box">

<div class="total-label">
TOTAL LUNCHES
</div>

<div
id="total"
class="total-number">

0

</div>

</div>

</div>


</div>



<script>


/* =========================================
   GOOGLE APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/a/macros/seminolescience.net/s/AKfycbxnLMwGSHSisca1RG5FbbBMBAMwZOQhNcDOVqPE71p_ddWkcIKLO-4boJPxFycDVFsyIA/exec";


/* =========================================
   BUILDING
========================================= */

const BUILDING =
"Building 1";


/* =========================================
   LOAD DATA
========================================= */

async function loadData() {

    try {

        const response =
            await fetch(
                API_URL +
                "?building=" +
                encodeURIComponent(BUILDING) +
                "&t=" +
                Date.now()
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            throw new Error(
                data.message ||
                "Unable to load data."
            );

        }


        displayData(data.entries);

    }

    catch (error) {

        console.error(error);

        document
        .getElementById("teacherList")
        .innerHTML =
        "<div style='color:#777;'>No entries yet.</div>";

    }

}



/* =========================================
   DISPLAY DATA
========================================= */

function displayData(entries) {

    const list =
        document.getElementById(
            "teacherList"
        );

    const totalElement =
        document.getElementById(
            "total"
        );


    list.innerHTML = "";


    if (
        !entries ||
        entries.length === 0
    ) {

        list.innerHTML =
        "<div style='color:#777;'>No lunch counts submitted yet.</div>";

        totalElement.textContent = "0";

        return;

    }


    let total = 0;


    entries.forEach(function(entry) {

        const count =
            Number(entry.lunchCount) || 0;

        total += count;


        const row =
            document.createElement(
                "div"
            );

        row.className =
            "teacher-row";


        const teacher =
            document.createElement(
                "span"
            );

        teacher.className =
            "teacher-name";

        teacher.textContent =
            entry.teacher;


        const countElement =
            document.createElement(
                "span"
            );

        countElement.className =
            "count";

        countElement.textContent =
            count;


        row.appendChild(teacher);

        row.appendChild(countElement);

        list.appendChild(row);

    });


    totalElement.textContent =
        total;

}



/* =========================================
   SUBMIT
========================================= */

document
.getElementById("lunchForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const teacher =
            document
            .getElementById("teacher")
            .value
            .trim();


        const lunchCount =
            document
            .getElementById("lunchCount")
            .value
            .trim();


        const message =
            document
            .getElementById("message");


        const submitBtn =
            document
            .getElementById("submitBtn");


        if (!teacher) {

            alert(
                "Please enter your name."
            );

            return;

        }


        if (
            lunchCount === "" ||
            !/^[0-9]+$/.test(lunchCount)
        ) {

            alert(
                "Please enter a valid number."
            );

            return;

        }


        submitBtn.disabled = true;

        message.textContent =
            "Saving...";


        const formData = {

            building:
                BUILDING,

            teacher:
                teacher,

            lunchCount:
                Number(lunchCount)

        };


        try {

            /*
             * text/plain prevents
             * unnecessary CORS preflight.
             */

            await fetch(
                API_URL,
                {
                    method: "POST",

                    mode: "no-cors",

                    headers: {
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                    JSON.stringify(formData)
                }
            );


            message.textContent =
                "✓ Lunch count saved!";


            document
            .getElementById("teacher")
            .value = "";


            document
            .getElementById("lunchCount")
            .value = "";


            /*
             * Give Google Sheets
             * a moment to save.
             */

            setTimeout(
                loadData,
                1000
            );


            setTimeout(
                function() {

                    message.textContent =
                        "";

                },
                3000
            );

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "There was an error saving.";

        }


        submitBtn.disabled = false;

    }
);



/* =========================================
   ONLY NUMBERS
========================================= */

document
.getElementById("lunchCount")
.addEventListener(
    "input",
    function() {

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );

    }
);



/* =========================================
   INITIAL LOAD
========================================= */

loadData();



/* =========================================
   REFRESH EVERY 10 SECONDS
========================================= */

setInterval(
    loadData,
    10000
);

</script>


</body>

</html>
